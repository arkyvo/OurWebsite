<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Web</title>
    <link rel="stylesheet" href="styles.css">
    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Borel&family=Delius&family=DynaPuff:wght@400..700&family=Playwrite+CU:wght@100..400&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&family=Twinkle+Star&display=swap" rel="stylesheet">
</head>
<body>

    <div id = mainBackground>
        <div id = cContent>
            <div class = "card-border" id="celeste">
                <div class ="card-photo" style="background-image: url('assets/pictures/cards/celeste.jpg')"></div>
                <p class = "quote">"Ikaw pa rin ang aking uuwian"</p>
                <div class = "card-info">
                    <p>Celeste</p>
                    <p>Tothapi</p>
                </div>
                <audio class="card-audio" src="assets/Music/arawAraw.mp3"></audio>
            </div>
            <div class = "card-border" id="ces">
                <div class ="card-photo" style="background-image: url('assets/pictures/cards/celeste.jpg')"></div>
                <p class = "quote">"Ikaw pa rin ang aking uuwian"</p>
                <div class = "card-info">
                    <p>Celeste</p>
                    <p>Tothapi</p>
                </div>
                <audio class="card-audio" src="assets/Music/arawAraw.mp3"></audio>
            </div>
        </div>
        <div id = "blackBackground"></div>
        <div id = "imageBackground" ></div>
    </div>

    <script>
    const cards = document.querySelectorAll('.card-border');

    const options = {
        root: document.getElementById('cContent'),
        /* Target area mobile fix: Creates a 'sweet spot' window in the dead center of the phone screen */
        rootMargin: "-25% 0px -25% 0px", 
        threshold: 0 
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-focused');
            } else {
                entry.target.classList.remove('is-focused');
            }
        });
    }, options);

    cards.forEach(card => observer.observe(card));
</script>   
 
</body>


</html>
